local_backend: true

backend:
  name: git-gateway
  branch: development # Stelle sicher, dass hier dein Haupt-Branch steht (main oder master)

  roles: [admin]

media_folder: "/assets/images/uploads"
public_folder: "/assets/images/uploads"

# Aktiviert direktes Bearbeiten, Löschen und Hochladen
collections:
  # 1. BEREICH: Allgemeine Artist-Infos & Social Links
  - name: "settings"
    label: "Einstellungen & Profil"
    delete: false # Verhindert versehentliches Löschen der Profil-Konfiguration
    files:
      - file: "content/settings.json"
        label: "Artist Profil & Links"
        name: "profile"
        fields:
          - { label: "Über mich Text", name: "about-text", widget: "text" }
          - { label: "Profilbild", name: "artist-image", widget: "image" }
          - { label: "Hintergrundbild", name: "hero-image", widget: "image", required: false }

  # 2. BEREICH: Portfolio-Tattoos (Einzelne Dateien = Bearbeiten & Löschen möglich)
  - name: "portfolio"
    label: "Portfolio Tattoos"
    files:
      - file: "content/tattoos.json"
        label: "Alle Tattoos"
        name: "tattoos_list"
        fields:
          - label: "Tattoos Liste"
            name: "items"
            widget: "list"
            fields:
                - { label: "Titel", name: "title", widget: "string" }
                - { label: "Bild", name: "image", widget: "image" }
                - {
                  label: "Kategorien",
                  name: "categories",
                  widget: "select",
                  multiple: true, # ERMÖGLICHT MEHRFACHAUSWAHL
                  options: [ "anime", "fineline", "blackwork" ]
                }