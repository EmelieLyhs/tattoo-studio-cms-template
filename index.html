<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurbanov Tattoo | Fine Line & Custom Art</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/header.css">
    <link rel="stylesheet" href="/assets/css/footer.css">

    <!-- Netlify Identity Widget für Logins & Einladungs-Tokens -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="main-placeholder"></div>
    <div id="footer-placeholder"></div>

    <script src="/assets/js/main.js"></script>
    <!-- Lightbox / Close-Up Popup -->
    <div id="image-modal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modal-img" alt="Zoomed Tattoo">
        <div id="modal-caption"></div>
    </div>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
    <!-- Hidden Dummy Form für den Netlify-Build-Bot -->
    <form name="tattoo-booking" data-netlify="true" data-netlify-honeypot="bot-field" action="/index.html" method="POST" enctype="multipart/form-data" hidden>        <input type="hidden" name="form-name" value="tattoo-booking" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="idea" />
        <input type="text" name="placement" />
        <input type="text" name="size" />
        <input type="text" name="style" />
        <input type="file" name="reference-images" />
        <input type="checkbox" name="coverup" />
    </form>
</body>
</html>
